<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Video Filter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h3>YouTube Video Filter 設定</h3>

      <div class="checkbox-group">
        <input id="enabled" type="checkbox">
        <label for="enabled">Anime4Kを有効にする</label>
      </div>

      <label for="profile">処理モード</label>
      <div class="select-group">
        <select id="profile">
          <option value="auto">自動（推奨）</option>
          <option value="mode-a">v4.x Mode A</option>
          <option value="mode-b">v4.x Mode B</option>
          <option value="mode-c">v4.x Mode C</option>
          <option value="mode-aa">v4.x Mode A+A</option>
          <option value="mode-bb">v4.x Mode B+B</option>
          <option value="mode-ac">v4.x Mode A+C（カスタム）</option>
          <option value="v4.1-low-resolution">v4.1 Low resolution experiment</option>
        </select>
      </div>

      <label for="color-range-mode">カラーレンジ変換</label>
      <div class="select-group">
        <select id="color-range-mode">
          <option value="none">変換なし</option>
          <option value="limited-to-full">リミテッド → フル</option>
          <option value="full-to-limited">フル → リミテッド</option>
        </select>
      </div>

      <div id="diagnostic-section">
        <div class="checkbox-group">
          <input id="detailed-logging" type="checkbox">
          <label for="detailed-logging">詳細ログを有効にする</label>
        </div>
        <div id="diagnostic-container" hidden>
          <label for="diagnostic-stage">診断パス</label>
        <select id="diagnostic-stage">
          <option value="full">D: 通常の全処理</option>
          <option value="source">A: 入力映像のみ</option>
          <option value="clamp">B: ClampHighlightsまで</option>
          <option value="restore">C: Restore CNN VLまで</option>
        </select>
        </div>
        <p class="warning">詳細ログを有効にすると継続的にフレーム状態を監視するため、動画再生やブラウザの動作が重くなる可能性があります。</p>
      </div>

      <p id="mode-note" class="note">自動では安定性を優先し、Mode Aを使用します。</p>
      <p class="note">保存した設定は開いているYouTubeタブへ即時反映されます。WebGPU対応GPUが必要です。</p>

      <spacer></spacer>
      <button id="save-button" type="button">保存</button>
      <div id="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
