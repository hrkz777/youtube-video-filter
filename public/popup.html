<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Video Filter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h3>YouTube Video Filter 設定</h3>

      <label for="anime4k-mode">Anime4K</label>
      <div class="select-group">
        <select id="anime4k-mode">
          <option value="off">オフ</option>
          <option value="auto">自動（推奨）</option>
          <option value="mode-a">Mode A</option>
          <option value="mode-b">Mode B</option>
          <option value="mode-c">Mode C</option>
          <option value="mode-aa">Mode A+A</option>
          <option value="mode-bb">Mode B+B</option>
          <option value="mode-ca">Mode C+A</option>
          <option value="v4.1-low-resolution">Low resolution experiment</option>
        </select>
      </div>

      <label for="color-range-mode">カラーレンジ変換</label>
      <div class="select-group">
        <select id="color-range-mode">
          <option value="none">変換なし</option>
          <option value="limited-to-full">リミテッド → フル</option>
          <option value="full-to-limited">フル → リミテッド</option>
        </select>
      </div>

      <fieldset class="adjustment-section">
        <legend>映像調整</legend>
        <div class="range-group">
          <div class="range-heading">
            <label for="brightness">明るさ</label>
            <output id="brightness-value" for="brightness">0%</output>
          </div>
          <div class="range-controls">
            <button class="adjustment-step-button" type="button" data-adjustment-decrement="brightness" aria-label="明るさを下げる">−</button>
            <input id="brightness" type="range" value="0">
            <button class="adjustment-step-button" type="button" data-adjustment-increment="brightness" aria-label="明るさを上げる">+</button>
          </div>
        </div>
        <div class="range-group">
          <div class="range-heading">
            <label for="contrast">コントラスト</label>
            <output id="contrast-value" for="contrast">0%</output>
          </div>
          <div class="range-controls">
            <button class="adjustment-step-button" type="button" data-adjustment-decrement="contrast" aria-label="コントラストを下げる">−</button>
            <input id="contrast" type="range" value="0">
            <button class="adjustment-step-button" type="button" data-adjustment-increment="contrast" aria-label="コントラストを上げる">+</button>
          </div>
        </div>
        <div class="range-group">
          <div class="range-heading">
            <label for="saturation">彩度</label>
            <output id="saturation-value" for="saturation">0%</output>
          </div>
          <div class="range-controls">
            <button class="adjustment-step-button" type="button" data-adjustment-decrement="saturation" aria-label="彩度を下げる">−</button>
            <input id="saturation" type="range" value="0">
            <button class="adjustment-step-button" type="button" data-adjustment-increment="saturation" aria-label="彩度を上げる">+</button>
          </div>
        </div>
        <div class="range-group">
          <div class="range-heading">
            <label for="gamma">ガンマ</label>
            <output id="gamma-value" for="gamma">100%</output>
          </div>
          <div class="range-controls">
            <button class="adjustment-step-button" type="button" data-adjustment-decrement="gamma" aria-label="ガンマを下げる">−</button>
            <input id="gamma" type="range" value="100">
            <button class="adjustment-step-button" type="button" data-adjustment-increment="gamma" aria-label="ガンマを上げる">+</button>
          </div>
        </div>
        <div class="range-group">
          <div class="range-heading">
            <label for="hue">色相</label>
            <output id="hue-value" for="hue">0°</output>
          </div>
          <div class="range-controls">
            <button class="adjustment-step-button" type="button" data-adjustment-decrement="hue" aria-label="色相を下げる">−</button>
            <input id="hue" type="range" value="0">
            <button class="adjustment-step-button" type="button" data-adjustment-increment="hue" aria-label="色相を上げる">+</button>
          </div>
        </div>
      </fieldset>

      <div id="diagnostic-section">
        <div class="checkbox-group">
          <input id="detailed-logging" type="checkbox">
          <label for="detailed-logging">詳細ログを有効にする</label>
        </div>
        <div id="diagnostic-container" hidden>
          <label for="diagnostic-stage">診断パス</label>
        <select id="diagnostic-stage">
          <option value="full">D: 通常の全処理</option>
          <option value="source">A: 入力映像のみ</option>
          <option value="clamp">B: ClampHighlightsまで</option>
          <option value="restore">C: Restore CNN VLまで</option>
        </select>
        </div>
        <p class="warning">詳細ログを有効にすると継続的にフレーム状態を監視するため、動画再生やブラウザの動作が重くなる可能性があります。</p>
      </div>

      <p id="mode-note" class="note">自動では安定性を優先し、Mode Aを使用します。</p>
      <p class="note">保存したフィルター設定は、新しく開くYouTubeタブのデフォルト値になります。WebGPU対応GPUが必要です。</p>

      <spacer></spacer>
      <button id="save-button" type="button">保存</button>
      <div id="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
